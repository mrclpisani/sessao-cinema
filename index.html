<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Trava do navegador: só roda código deste site e só fala com o serviço que apresenta os PCs.
     Limite conhecido: o script da página é embutido, por isso 'unsafe-inline'; para fechar isso,
     mover o script para um arquivo próprio e tirar 'unsafe-inline' de script-src. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; media-src mediastream: blob:; base-uri 'none'; form-action 'none'">
<title>Sessão de cinema</title>
<style>
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { background: #0b0b0d; color: #e8e6e1; font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column }
  [hidden] { display: none !important }
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain }
  #inicio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center }
  h1 { font-size: 22px; font-weight: 600; margin: 0 }
  #dica, #rede { color: #a3a19b; margin: 0; max-width: 34em }
  #cadastro { display: flex; gap: 8px; width: min(100%, 34em) }
  #codigo { flex: 1; min-width: 0; font-family: ui-monospace, monospace; font-size: 13px }
  #testar { background: none; border: 0; color: #a3a19b; font-size: 13px; text-decoration: underline }
  #aviso { color: #ffcf70; margin: 0; padding: 6px 12px; text-align: center }
  #aviso:empty { display: none }
  #barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #17171a; border-top: 1px solid #2a2a2f }
  button, select, input { font: inherit; color: inherit; background: #232327; border: 1px solid #3a3a40; border-radius: 8px; padding: 7px 12px }
  button { cursor: pointer }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 1px }
  .principal { background: #e8e6e1; color: #0b0b0d; border-color: #e8e6e1; font-weight: 600 }
  #acao, #cheia { background: #e8e6e1; color: #0b0b0d; border: 0; font-size: 17px; font-weight: 600; padding: 12px 24px }
  #acao:disabled { opacity: .5; cursor: default }
  /* Um selo por amigo, colorido pelo estado; os números ficam na dica ao passar o mouse. */
  #amigos { display: flex; flex-wrap: wrap; gap: 8px }
  .selo { display: inline-flex; align-items: center; gap: 6px; background: #232327; color: #a3a19b; border-radius: 8px; padding: 7px 12px; white-space: nowrap; cursor: default }
  .selo.ok, .selo.alerta { cursor: help }
  .selo.ok::before, .selo.alerta::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor }
  .selo.ok { background: #16301f; color: #8fe0a8 }
  .selo.alerta { background: #3a2c0f; color: #ffcf70 }
  .selo button { padding: 2px 8px; margin-left: 4px }
  details { position: relative }
  summary { list-style: none; cursor: pointer; background: #232327; border: 1px solid #3a3a40; border-radius: 8px; padding: 7px 12px }
  summary::-webkit-details-marker { display: none }
  summary:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 1px }
  details > div { position: absolute; bottom: calc(100% + 8px); right: 0; width: 270px; display: flex; flex-direction: column; gap: 8px; background: #17171a; border: 1px solid #3a3a40; border-radius: 8px; padding: 12px }
  details label { display: flex; flex-direction: column; gap: 4px }
  details select { width: 100% }
  details p { margin: 0; color: #a3a19b; font-size: 13px }
  #parar { color: #ff8a80; margin-left: auto }
  /* Celular em pé: o filme ocupa só uma faixa, então sobra espaço para um botão grande de tela cheia. */
  #cheia { display: none }
  @media (orientation: portrait) and (max-width: 700px) {
    body.assistindo { justify-content: center; gap: 14px }
    body.assistindo video { flex: none; height: auto }
    body.assistindo #cheia { display: block; margin: 0 16px }
  }
</style>

<div id="inicio">
  <h1>Sessão de cinema</h1>
  <p id="dica">Conferindo este aparelho…</p>
  <button id="acao" hidden></button>
  <div id="cadastro" hidden>
    <input id="codigo" readonly aria-label="Código deste aparelho">
    <button id="copiarcodigo" class="principal">Copiar código</button>
  </div>
  <button id="testar">Testar minha rede</button>
  <p id="rede" role="status"></p>
</div>
<video id="video" playsinline hidden></video>
<button id="cheia">Tela cheia</button>
<p id="aviso" role="status"></p>
<div id="barra" hidden>
  <button id="copiar" class="principal">Copiar link</button>
  <span id="amigos" aria-label="Quem está assistindo"></span>
  <span id="semaudio" class="selo alerta" hidden title="O som só vem ao compartilhar uma aba ou a tela inteira, com a opção de áudio marcada.">Sem áudio <button id="denovo">Compartilhar de novo</button></span>
  <span id="telatoda" class="selo alerta" hidden title="Notificações, outras janelas e o que você digitar ficam visíveis para quem assiste. Para mostrar só o filme, compartilhe apenas a aba.">Tela inteira visível <button id="soaba">Trocar</button></span>
  <label>Qualidade
    <select id="qualidade">
      <option value="3">Econômica (3 Mbps)</option>
      <option value="6" selected>Boa (6 Mbps)</option>
      <option value="10">Máxima (10 Mbps)</option>
    </select>
  </label>
  <details>
    <summary>Avançado</summary>
    <div>
      <label>Codec
        <select id="codec">
          <option value="VP9" selected>VP9 (mais leve)</option>
          <option value="AV1">AV1 (melhor imagem, mais CPU)</option>
        </select>
      </label>
      <p>Trocar o codec reconecta todos por alguns segundos.</p>
    </div>
  </details>
  <button id="parar">Parar</button>
</div>

<!-- PeerJS 1.5.5 (MIT), cópia do pacote do npm guardada aqui: nenhum código é carregado de outro site. -->
<script src="peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const sala = location.hash.slice(1);          // com #código = espectador; sem = quem compartilha
const chamadas = new Set();
let peer, stream;

// Servidores que só informam o endereço público de cada um. Os retransmissores padrão do PeerJS
// saíram do ar (o nome nem resolve), então ficam de fora: sem eles não há erro nem espera à toa.
const REDE = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] } };

const avisar = texto => { $('aviso').textContent = texto; };
// O Chrome só envia Opus em estéreo se o SDP pedir; sem isto o filme chega mono.
const estereo = sdp => sdp.replace(/useinbandfec=1/g, 'useinbandfec=1;stereo=1;maxaveragebitrate=256000');
// Só na oferta de quem compartilha: põe o codec escolhido na frente do padrão (VP8).
// Medido neste PC em 1080p a 6 Mbps: VP9 30 fps (13 ms/quadro); AV1 30 fps (20 ms/quadro, comprime melhor);
// VP8 ficou em 22 fps; H.264 (placa AMD) travou em 2 Mbps.
function preferirCodec(sdp) {
  const preferidos = [...sdp.matchAll(new RegExp(`a=rtpmap:(\\d+) ${$('codec').value}/`, 'g'))].map(m => m[1]);
  return sdp.replace(/(m=video \S+ \S+) (.*)/, (_, inicio, tipos) =>
    inicio + ' ' + [...preferidos, ...tipos.split(' ').filter(t => !preferidos.includes(t))].join(' '));
}

function tocar(s, opcoes) {
  const v = $('video');
  if (v.srcObject === s) return;              // o PeerJS dispara 'stream' uma vez por faixa
  Object.assign(v, { srcObject: s, hidden: false }, opcoes);
  $('inicio').hidden = true;
  v.play().catch(e => { if (e.name === 'NotAllowedError') avisar('Clique no play para iniciar.'); });
}

// ---------- autorização por aparelho ----------

// Cada navegador tem um par de chaves próprio, e a chave privada nunca sai dele. Só participa quem
// tiver a chave pública listada em autorizados.json e provar, assinando um desafio, que é o dono dela.
const ALG = { name: 'ECDSA', namedCurve: 'P-256' }, ASSINATURA = { name: 'ECDSA', hash: 'SHA-256' };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const deB64 = txt => Uint8Array.from(atob(txt.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
// O que é assinado: o desafio sorteado por quem compartilha mais o código da sala, para a resposta não servir em outra sala.
const paraAssinar = (desafio, salaId) => new TextEncoder().encode(desafio + '|' + salaId);
let aparelho;   // { par, chave }: as chaves deste navegador e a pública em texto

async function carregarAparelho() {
  const db = await new Promise((ok, erro) => {
    const r = indexedDB.open('sessao-cinema', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('chaves');
    r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
  });
  const novo = await crypto.subtle.generateKey(ALG, false, ['sign', 'verify']);   // privada não exportável
  const par = await new Promise((ok, erro) => {   // usa a chave já guardada; só grava a nova se não houver nenhuma
    const t = db.transaction('chaves', 'readwrite'), loja = t.objectStore('chaves'), r = loja.get('aparelho');
    let escolhido;
    r.onsuccess = () => { escolhido = r.result ?? novo; if (!r.result) loja.put(novo, 'aparelho'); };
    t.oncomplete = () => ok(escolhido); t.onerror = () => erro(t.error);
  });
  return { par, chave: b64(await crypto.subtle.exportKey('raw', par.publicKey)) };
}

async function autorizados() {
  const r = await fetch('autorizados.json?' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('lista de autorizados indisponível');
  // A lista é editada à mão, então a leitura pega cada par nome/chave direto do texto: uma vírgula
  // faltando ou sobrando entre as linhas não derruba todo mundo, como aconteceria com JSON.parse.
  return [...(await r.text()).matchAll(/"nome"\s*:\s*"([^"]+)"\s*,\s*"chave"\s*:\s*"([A-Za-z0-9_-]+)"/g)]
    .map(([, nome, chave]) => ({ nome, chave }));
}

const assinar = async desafio => b64(await crypto.subtle.sign(ASSINATURA, aparelho.par.privateKey, paraAssinar(desafio, sala)));

// Devolve o nome cadastrado se a resposta vier de um aparelho autorizado; senão, null.
async function conferir(resposta, desafio, salaId) {
  if (typeof resposta?.chave !== 'string' || typeof resposta?.assinatura !== 'string'
    || resposta.chave.length > 200 || resposta.assinatura.length > 200) return null;
  const registro = (await autorizados()).find(a => a.chave === resposta.chave);   // lista lida na hora: vale quem foi incluído há pouco
  if (!registro) return null;
  const publica = await crypto.subtle.importKey('raw', deB64(resposta.chave), ALG, false, ['verify']);
  const valida = await crypto.subtle.verify(ASSINATURA, publica, deB64(resposta.assinatura), paraAssinar(desafio, salaId));
  return valida ? registro.nome.slice(0, 30) : null;
}

// ---------- quem compartilha ----------

function capturar() {
  if (new URLSearchParams(location.search).has('teste')) return streamDeTeste();
  return navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: 30, width: { max: 1920 }, height: { max: 1080 } },
    // filtros de voz desligados: eles destroem música e efeitos de filme
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
    systemAudio: 'include',
    windowAudio: 'window',   // Chrome recente: oferece o áudio do programa ao compartilhar uma janela
  });
}

// Só para a verificação automática (?teste): imagem e som sintéticos, sem o seletor de tela.
function streamDeTeste() {
  const c = Object.assign(document.createElement('canvas'), { width: 640, height: 360 });
  const g = c.getContext('2d');
  setInterval(() => { g.fillStyle = `hsl(${Date.now() / 20 % 360} 70% 40%)`; g.fillRect(0, 0, 640, 360); }, 33);
  const audio = new AudioContext(), destino = audio.createMediaStreamDestination(), osc = audio.createOscillator();
  osc.connect(destino); osc.start();
  const mudo = new URLSearchParams(location.search).get('teste') === 'mudo';   // ?teste=mudo simula captura sem som
  return new MediaStream([...c.captureStream(30).getTracks(), ...(mudo ? [] : destino.stream.getTracks())]);
}

function limitar(chamada) {
  const envio = chamada.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
  const p = envio?.getParameters();
  if (!p?.encodings?.length) return;
  p.encodings[0].maxBitrate = $('qualidade').value * 1e6;
  // Sem isto o navegador encolhe a imagem (até 270p) quando a taxa aperta; aqui ele derruba fps e mantém a nitidez.
  p.degradationPreference = 'maintain-resolution';
  envio.setParameters(p).catch(() => {});
}

// Um selo por amigo: verde quando vai bem, amarelo quando algo segura a qualidade. Os números reais
// (resolução, fps, taxa, estimativa da rede) ficam na dica do selo.
const ultima = new WeakMap();
const MAX_AMIGOS = 8;
let linkSala = '';
async function medir() {
  const selos = [];
  for (const c of chamadas) {
    const selo = Object.assign(document.createElement('span'), { className: 'selo', textContent: c.nome, title: 'Conectando…' });
    selos.push(selo);
    if (c.peerConnection?.connectionState !== 'connected') continue;
    const st = [...(await c.peerConnection.getStats()).values()];
    const o = st.find(s => s.type === 'outbound-rtp' && s.kind === 'video');
    if (!o) continue;
    const par = st.find(s => s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded');
    const a = ultima.get(c) ?? o; ultima.set(c, o);
    const mbps = (o.bytesSent - a.bytesSent) * 8 / (o.timestamp - a.timestamp) / 1000 || 0;
    const limite = { bandwidth: 'rede no limite', cpu: 'seu PC no limite' }[o.qualityLimitationReason];
    selo.classList.add(limite ? 'alerta' : 'ok');
    const num = x => x.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
    selo.title = `${o.frameHeight ?? '?'}p · ${Math.round(o.framesPerSecond ?? 0)} fps · ${num(mbps)} Mbps — ${limite ?? 'boa'}`
      + (par?.availableOutgoingBitrate ? ` (a rede até ele aguenta cerca de ${num(par.availableOutgoingBitrate / 1e6)} Mbps)` : '');
  }
  if (!selos.length) selos.push(Object.assign(document.createElement('span'), { className: 'selo', textContent: 'Ninguém assistindo ainda' }));
  $('amigos').replaceChildren(...selos);
  $('copiar').classList.toggle('principal', !chamadas.size);   // mandar o link é o próximo passo só enquanto a sala está vazia
}

// Captura (ou captura de novo) e passa a usar como fonte da sessão.
async function trocarFonte() {
  let nova;
  try { nova = await capturar(); }
  catch { avisar('Compartilhamento cancelado.'); return false; }
  stream?.getTracks().forEach(t => { t.onended = null; t.stop(); });
  stream = nova;
  const [video] = stream.getVideoTracks();
  video.contentHint = 'motion';               // filme: prioriza fluidez em vez de nitidez de texto
  video.onended = parar;                      // botão "parar de compartilhar" do navegador
  $('semaudio').hidden = stream.getAudioTracks().length > 0;
  $('telatoda').hidden = video.getSettings().displaySurface !== 'monitor';
  avisar('');
  tocar(new MediaStream([video]), { muted: true });   // prévia só com imagem: não tem como ela emitir som
  [...chamadas].forEach(c => c.close());      // quem já assiste reconecta sozinho e recebe a fonte nova
  return true;
}

async function compartilhar() {
  if (!await trocarFonte()) return;
  peer = new Peer(crypto.randomUUID(), REDE); // o código da sala é a chave: longo e novo a cada sessão
  peer.on('open', id => {
    linkSala = location.href.split('#')[0] + '#' + id;
    $('barra').hidden = false;
    medir();
  });
  peer.on('disconnected', () => peer.reconnect());   // sem isto, quem chega atrasado não entra
  setInterval(medir, 2000);
  peer.on('error', e => avisar('Erro de conexão: ' + e.type));
  peer.on('connection', conexao => {
    // Cada espectador custa uma codificação de vídeo: sem teto, um link vazado travaria o PC de quem compartilha.
    if (chamadas.size >= MAX_AMIGOS) return conexao.close();
    // O vídeo só é enviado depois que o aparelho prova, assinando este desafio, que está na lista.
    const desafio = b64(crypto.getRandomValues(new Uint8Array(32)));
    const prazo = setTimeout(() => conexao.close(), 15000);   // não respondeu ao desafio
    let respondeu = false;
    conexao.on('open', () => conexao.send({ desafio }));
    conexao.on('data', async resposta => {
      if (respondeu) return;                                  // um desafio, uma resposta
      respondeu = true; clearTimeout(prazo);
      const nome = await conferir(resposta, desafio, peer.id).catch(() => null);
      if (!conexao.open) return;
      if (!nome || chamadas.size >= MAX_AMIGOS) {
        conexao.send({ recusado: true });
        return setTimeout(() => conexao.close(), 500);        // dá tempo de o aviso chegar
      }
      const chamada = Object.assign(peer.call(conexao.peer, stream, { sdpTransform: sdp => preferirCodec(estereo(sdp)) }), { nome });
      chamadas.add(chamada); medir();
      const sair = () => { if (chamadas.delete(chamada)) { chamada.close(); medir(); } };
      conexao.on('close', sair);
      chamada.on('close', sair);
      const pc = chamada.peerConnection;
      pc.addEventListener('connectionstatechange', () => {
        if (pc.connectionState === 'connected') limitar(chamada);
        else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') sair();
      });
    });
  });
}

function parar() {
  stream?.getTracks().forEach(t => t.stop());
  peer?.destroy();                            // avisa os amigos que acabou
  location.reload();
}

// ---------- quem assiste ----------

// Atraso de reprodução de quem assiste. Maior = mais resistente a oscilação de rede, porém mais
// defasado de quem compartilha (reações na call chegam adiantadas). Faixa útil: 200 a 2000.
const ATRASO_MS = 600;
let chamadaAtual, espera, falhas = 0;

function assistir() {
  $('acao').disabled = true;
  const antigo = peer, meu = peer = new Peer(REDE);
  antigo?.destroy();
  let conectou = false, recebido;
  const cair = () => { if (meu === peer) reconectar(!conectou); };   // ignora eventos de uma conexão já substituída
  const prazo = setTimeout(cair, 20000);                    // pedido perdido no caminho não gera erro: tenta de novo
  meu.on('open', () => {
    const conexao = meu.connect(sala);
    conexao.on('close', cair);
    conexao.on('data', async d => {
      if (meu !== peer) return;
      if (d?.recusado) return fim('Este aparelho não está autorizado nesta sala.');
      // Responde ao desafio de quem compartilha com a assinatura deste aparelho.
      if (typeof d?.desafio === 'string' && d.desafio.length <= 100) conexao.send({ chave: aparelho.chave, assinatura: await assinar(d.desafio) });
    });
  });
  meu.on('call', chamada => {
    if (chamada.peer !== sala) return chamada.close();   // só aceita vídeo de quem é dono da sala do link
    chamadaAtual = chamada;
    chamada.answer(undefined, { sdpTransform: estereo });
    // Só mostra o vídeo quando a conexão fecha de verdade; antes disso seria uma tela preta.
    const mostrar = () => {
      if (!recebido || chamada.peerConnection?.connectionState !== 'connected') return;
      clearTimeout(prazo); conectou = true; falhas = 0; avisar(''); tocar(recebido, { controls: true });
      document.body.classList.add('assistindo');
      // Filme não precisa de tempo real: um buffer maior dá tempo de repor pacotes perdidos antes de travar.
      chamada.peerConnection.getReceivers().forEach(r => { r.jitterBufferTarget = ATRASO_MS; });
    };
    chamada.on('stream', s => {
      if (!recebido) chamada.peerConnection.addEventListener('connectionstatechange', mostrar);
      recebido = s; mostrar();
    });
    chamada.on('close', cair);
  });
  meu.on('error', e => {
    if (meu !== peer) return;
    if (e.type === 'peer-unavailable') fim();   // quem compartilha saiu, ou o link é antigo
    else cair();
  });
}

// Celular em segundo plano, troca de rede ou queda momentânea: tenta de novo sozinho.
function reconectar(semConectar) {
  if (espera) return;
  if (semConectar) falhas++;
  avisar(falhas < 2 ? 'Reconectando…'
    : 'Não foi possível conectar direto com quem compartilha: as duas redes não se alcançam. Usem "Testar minha rede" nos dois lados. Tentando de novo…');
  espera = setTimeout(() => { espera = 0; assistir(); }, 2000);
}

function fim(texto = 'A sessão terminou ou o link não vale mais.') {
  falhas = 0;
  clearTimeout(espera); espera = 0;
  const p = peer; peer = null; p?.destroy();
  document.body.classList.remove('assistindo');
  $('video').hidden = true;
  $('inicio').hidden = false;
  $('acao').disabled = false;
  avisar(texto);
}

// ---------- diagnóstico de rede ----------

// Pergunta o endereço público a dois servidores. Se cada um enxerga uma porta diferente, o NAT é do
// tipo que impede conexão direta (comum em 4G, CGNAT e VPN). IPv6 público contorna o NAT.
async function testarRede() {
  $('rede').textContent = 'Testando a rede…';
  const pc = new RTCPeerConnection(REDE.config);
  const candidatos = [];
  pc.onicecandidate = e => { if (e.candidate) candidatos.push(e.candidate); };
  pc.createDataChannel('teste');
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(fim => { pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && fim(); setTimeout(fim, 8000); });
  pc.close();
  const publicos = candidatos.filter(c => c.type === 'srflx');
  const portasV4 = new Set(publicos.filter(c => !c.address.includes(':')).map(c => c.port));
  const ipv6 = publicos.some(c => c.address.includes(':')) ? 'IPv6 público: sim.' : 'IPv6 público: não.';
  $('rede').textContent = (
    !publicos.length ? 'Sua rede não respondeu por UDP (firewall ou VPN): a conexão direta não vai funcionar.'
    : portasV4.size > 1 ? 'Sua rede usa NAT restritivo: a conexão direta costuma falhar. Tente sem VPN ou pela rede fixa.'
    : 'Sua rede aceita conexão direta.') + ' ' + ipv6;
}
$('testar').onclick = () => testarRede().catch(() => { $('rede').textContent = 'Não foi possível testar a rede neste navegador.'; });

// ---------- início ----------

// Antes de qualquer coisa, confere se este aparelho está na lista. Na dúvida (lista fora do ar), não libera.
async function iniciar() {
  let registro;
  try {
    aparelho = await carregarAparelho();
    registro = (await autorizados()).find(a => a.chave === aparelho.chave);
  } catch {
    $('dica').textContent = 'Não foi possível conferir a autorização deste aparelho. Recarregue a página.';
    return;
  }
  if (!registro) {
    $('dica').textContent = 'Este aparelho ainda não foi autorizado. Envie o código abaixo para quem administra esta página e recarregue depois de liberado.';
    $('codigo').value = aparelho.chave;
    $('cadastro').hidden = false;
    $('copiarcodigo').onclick = () => navigator.clipboard.writeText(aparelho.chave).then(
      () => { $('copiarcodigo').textContent = 'Copiado'; },
      () => $('codigo').select());   // sem permissão de área de transferência: deixa selecionado para copiar à mão
    return;
  }
  $('acao').hidden = false;
  prepararPapel();
}
iniciar();

function prepararPapel() {
if (sala) {
  $('dica').textContent = 'Você foi convidado para assistir.';
  $('acao').textContent = 'Assistir';
  $('acao').onclick = () => { avisar('Conectando…'); assistir(); };
  addEventListener('pagehide', () => peer?.destroy());
  $('cheia').onclick = async () => {
    const v = $('video');
    try {
      await (v.requestFullscreen ? v.requestFullscreen() : v.webkitEnterFullscreen());   // iPhone só tem a segunda
      await screen.orientation?.lock?.('landscape');                                      // abre deitado onde o navegador deixa
    } catch { /* sem tela cheia ou sem trava de orientação: o vídeo segue como está */ }
  };
  document.addEventListener('visibilitychange', () => {   // voltou para a aba: confere se a conexão sobreviveu
    const estado = chamadaAtual?.peerConnection?.connectionState;
    if (!document.hidden && peer && estado && estado !== 'connected' && estado !== 'connecting') reconectar();
  });
} else {
  $('dica').textContent = 'Escolha uma aba ou a tela inteira e marque a opção de compartilhar o áudio.';
  $('acao').textContent = 'Compartilhar tela';
  $('acao').onclick = compartilhar;
  $('copiar').onclick = () => navigator.clipboard.writeText(linkSala).then(() => {
    $('copiar').textContent = 'Copiado';
    setTimeout(() => { $('copiar').textContent = 'Copiar link'; }, 1500);
  }, () => prompt('Copie o link da sala:', linkSala));   // sem permissão de área de transferência
  $('denovo').onclick = $('soaba').onclick = trocarFonte;
  $('qualidade').onchange = () => chamadas.forEach(limitar);
  // O codec é combinado na conexão: derruba as chamadas e os amigos reconectam sozinhos já com o novo.
  $('codec').onchange = () => [...chamadas].forEach(c => c.close());
  $('parar').onclick = parar;
}
}
</script>
