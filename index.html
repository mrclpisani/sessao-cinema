<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sessão de cinema</title>
<style>
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body { background: #0b0b0d; color: #e8e6e1; font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column }
  [hidden] { display: none !important }
  video { flex: 1; min-height: 0; width: 100%; background: #000; object-fit: contain }
  #inicio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center }
  h1 { font-size: 22px; font-weight: 600; margin: 0 }
  #dica, #rede { color: #a3a19b; margin: 0; max-width: 34em }
  #testar { background: none; border: 0; color: #a3a19b; font-size: 13px; text-decoration: underline }
  #aviso { color: #ffcf70; margin: 0; padding: 6px 12px; text-align: center }
  #aviso:empty { display: none }
  #barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #17171a; border-top: 1px solid #2a2a2f }
  button, select, input { font: inherit; color: inherit; background: #232327; border: 1px solid #3a3a40; border-radius: 8px; padding: 7px 12px }
  button { cursor: pointer }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 1px }
  #acao { background: #e8e6e1; color: #0b0b0d; border: 0; font-size: 17px; font-weight: 600; padding: 12px 24px }
  #acao:disabled { opacity: .5; cursor: default }
  #link { flex: 1; min-width: 160px; font-family: ui-monospace, monospace; font-size: 13px }
  #contador { background: #16301f; color: #8fe0a8; border-radius: 8px; padding: 7px 12px; white-space: nowrap }
  #envio { color: #a3a19b; font-size: 13px }
  #parar { color: #ff8a80 }
</style>

<div id="inicio">
  <h1>Sessão de cinema</h1>
  <p id="dica"></p>
  <button id="acao"></button>
  <button id="testar">Testar minha rede</button>
  <p id="rede" role="status"></p>
</div>
<video id="video" playsinline hidden></video>
<p id="aviso" role="status"></p>
<div id="barra" hidden>
  <input id="link" readonly aria-label="Link da sala">
  <button id="copiar">Copiar link</button>
  <label>Qualidade
    <select id="qualidade">
      <option value="3">3 Mbps</option>
      <option value="6" selected>6 Mbps</option>
      <option value="10">10 Mbps</option>
    </select>
  </label>
  <label>Codec
    <select id="codec">
      <option value="VP9" selected>VP9 (mais leve)</option>
      <option value="AV1">AV1 (melhor imagem, mais CPU)</option>
    </select>
  </label>
  <span id="contador" role="status">0 assistindo</span>
  <span id="envio"></span>
  <button id="parar">Parar</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const sala = location.hash.slice(1);          // com #código = espectador; sem = quem compartilha
const chamadas = new Set();
let peer, stream;

const avisar = texto => { $('aviso').textContent = texto; };
// O Chrome só envia Opus em estéreo se o SDP pedir; sem isto o filme chega mono.
const estereo = sdp => sdp.replace(/useinbandfec=1/g, 'useinbandfec=1;stereo=1;maxaveragebitrate=256000');
// Só na oferta de quem compartilha: põe o codec escolhido na frente do padrão (VP8).
// Medido neste PC em 1080p a 6 Mbps: VP9 30 fps (13 ms/quadro); AV1 30 fps (20 ms/quadro, comprime melhor);
// VP8 ficou em 22 fps; H.264 (placa AMD) travou em 2 Mbps.
function preferirCodec(sdp) {
  const preferidos = [...sdp.matchAll(new RegExp(`a=rtpmap:(\\d+) ${$('codec').value}/`, 'g'))].map(m => m[1]);
  return sdp.replace(/(m=video \S+ \S+) (.*)/, (_, inicio, tipos) =>
    inicio + ' ' + [...preferidos, ...tipos.split(' ').filter(t => !preferidos.includes(t))].join(' '));
}

function tocar(s, opcoes) {
  const v = $('video');
  if (v.srcObject === s) return;              // o PeerJS dispara 'stream' uma vez por faixa
  Object.assign(v, { srcObject: s, hidden: false }, opcoes);
  $('inicio').hidden = true;
  v.play().catch(e => { if (e.name === 'NotAllowedError') avisar('Clique no play para iniciar.'); });
}

// ---------- quem compartilha ----------

function capturar() {
  if (new URLSearchParams(location.search).has('teste')) return streamDeTeste();
  return navigator.mediaDevices.getDisplayMedia({
    video: { frameRate: 30, width: { max: 1920 }, height: { max: 1080 } },
    // filtros de voz desligados: eles destroem música e efeitos de filme
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
    systemAudio: 'include',
    windowAudio: 'window',   // Chrome recente: oferece o áudio do programa ao compartilhar uma janela
  });
}

// Só para a verificação automática (?teste): imagem e som sintéticos, sem o seletor de tela.
function streamDeTeste() {
  const c = Object.assign(document.createElement('canvas'), { width: 640, height: 360 });
  const g = c.getContext('2d');
  setInterval(() => { g.fillStyle = `hsl(${Date.now() / 20 % 360} 70% 40%)`; g.fillRect(0, 0, 640, 360); }, 33);
  const audio = new AudioContext(), destino = audio.createMediaStreamDestination(), osc = audio.createOscillator();
  osc.connect(destino); osc.start();
  return new MediaStream([...c.captureStream(30).getTracks(), ...destino.stream.getTracks()]);
}

function limitar(chamada) {
  const envio = chamada.peerConnection?.getSenders().find(s => s.track?.kind === 'video');
  const p = envio?.getParameters();
  if (!p?.encodings?.length) return;
  p.encodings[0].maxBitrate = $('qualidade').value * 1e6;
  // Sem isto o navegador encolhe a imagem (até 270p) quando a taxa aperta; aqui ele derruba fps e mantém a nitidez.
  p.degradationPreference = 'maintain-resolution';
  envio.setParameters(p).catch(() => {});
}

const contar = () => { $('contador').textContent = `${chamadas.size} assistindo`; };

// Mostra o que realmente está saindo para cada amigo: resolução, fps, taxa e o que está limitando.
const ultima = new WeakMap();
async function medir() {
  const partes = [];
  for (const c of chamadas) {
    if (!c.peerConnection) continue;
    const st = [...(await c.peerConnection.getStats()).values()];
    const o = st.find(s => s.type === 'outbound-rtp' && s.kind === 'video');
    if (!o) continue;
    // Quanto a rede acha que aguenta, e se o caminho passa por um servidor de retransmissão (mais lento).
    const par = st.find(s => s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded');
    const rede = par?.availableOutgoingBitrate ? `, rede estima ${(par.availableOutgoingBitrate / 1e6).toFixed(1)}` : '';
    const relay = [par?.localCandidateId, par?.remoteCandidateId].some(id => st.find(s => s.id === id)?.candidateType === 'relay');
    const a = ultima.get(c) ?? o; ultima.set(c, o);
    const mbps = (o.bytesSent - a.bytesSent) * 8 / (o.timestamp - a.timestamp) / 1000 || 0;
    const limite = { bandwidth: ' (rede no limite)', cpu: ' (CPU no limite)' }[o.qualityLimitationReason] ?? '';
    partes.push(`${o.frameHeight ?? '?'}p ${Math.round(o.framesPerSecond ?? 0)} fps ${mbps.toFixed(1)} Mbps${limite}${rede}${relay ? ', via retransmissão' : ''}`);
  }
  $('envio').textContent = partes.join(' | ');
}

async function compartilhar() {
  try { stream = await capturar(); }
  catch { return avisar('Compartilhamento cancelado.'); }
  const [video] = stream.getVideoTracks();
  video.contentHint = 'motion';               // filme: prioriza fluidez em vez de nitidez de texto
  video.onended = parar;                      // botão "parar de compartilhar" do navegador
  avisar(stream.getAudioTracks().length ? '' : 'Sem áudio: pare e compartilhe de novo marcando a opção de áudio (só aparece para aba ou tela inteira).');
  tocar(new MediaStream([video]), { muted: true });   // prévia só com imagem: não tem como ela emitir som

  peer = new Peer(crypto.randomUUID());       // o código da sala é a chave: longo e novo a cada sessão
  peer.on('open', id => {
    $('link').value = location.href.split('#')[0] + '#' + id;
    $('barra').hidden = false;
  });
  peer.on('disconnected', () => peer.reconnect());   // sem isto, quem chega atrasado não entra
  setInterval(medir, 2000);
  peer.on('error', e => avisar('Erro de conexão: ' + e.type));
  peer.on('connection', conexao => {
    const chamada = peer.call(conexao.peer, stream, { sdpTransform: sdp => preferirCodec(estereo(sdp)) });
    chamadas.add(chamada); contar();
    const sair = () => { if (chamadas.delete(chamada)) { chamada.close(); contar(); } };
    conexao.on('close', sair);
    chamada.on('close', sair);
    const pc = chamada.peerConnection;
    pc.addEventListener('connectionstatechange', () => {
      if (pc.connectionState === 'connected') limitar(chamada);
      else if (pc.connectionState === 'failed' || pc.connectionState === 'closed') sair();
    });
  });
}

function parar() {
  stream?.getTracks().forEach(t => t.stop());
  peer?.destroy();                            // avisa os amigos que acabou
  location.reload();
}

// ---------- quem assiste ----------

// Atraso de reprodução de quem assiste. Maior = mais resistente a oscilação de rede, porém mais
// defasado de quem compartilha (reações na call chegam adiantadas). Faixa útil: 200 a 2000.
const ATRASO_MS = 600;
let chamadaAtual, espera;

function assistir() {
  $('acao').disabled = true;
  const antigo = peer, meu = peer = new Peer();
  antigo?.destroy();
  const cair = () => { if (meu === peer) reconectar(); };   // ignora eventos de uma conexão já substituída
  const prazo = setTimeout(cair, 10000);                    // pedido perdido no caminho não gera erro: tenta de novo
  meu.on('open', () => meu.connect(sala).on('close', cair));
  meu.on('call', chamada => {
    chamadaAtual = chamada;
    chamada.answer(undefined, { sdpTransform: estereo });
    chamada.on('stream', s => {
      clearTimeout(prazo); avisar(''); tocar(s, { controls: true });
      // Filme não precisa de tempo real: um buffer maior dá tempo de repor pacotes perdidos antes de travar.
      chamada.peerConnection.getReceivers().forEach(r => { r.jitterBufferTarget = ATRASO_MS; });
    });
    chamada.on('close', cair);
  });
  meu.on('error', e => {
    if (meu !== peer) return;
    if (e.type === 'peer-unavailable') fim();   // quem compartilha saiu, ou o link é antigo
    else cair();
  });
}

// Celular em segundo plano, troca de rede ou queda momentânea: tenta de novo sozinho.
function reconectar() {
  if (espera) return;
  avisar('Reconectando…');
  espera = setTimeout(() => { espera = 0; assistir(); }, 2000);
}

function fim() {
  clearTimeout(espera); espera = 0;
  const p = peer; peer = null; p?.destroy();
  $('video').hidden = true;
  $('inicio').hidden = false;
  $('acao').disabled = false;
  avisar('A sessão terminou ou o link não vale mais.');
}

// ---------- diagnóstico de rede ----------

// Pergunta o endereço público a dois servidores. Se cada um enxerga uma porta diferente, o NAT é do
// tipo que impede conexão direta (comum em 4G, CGNAT e VPN). IPv6 público contorna o NAT.
async function testarRede() {
  $('rede').textContent = 'Testando a rede…';
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] });
  const candidatos = [];
  pc.onicecandidate = e => { if (e.candidate) candidatos.push(e.candidate); };
  pc.createDataChannel('teste');
  await pc.setLocalDescription(await pc.createOffer());
  await new Promise(fim => { pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && fim(); setTimeout(fim, 8000); });
  pc.close();
  const publicos = candidatos.filter(c => c.type === 'srflx');
  const portasV4 = new Set(publicos.filter(c => !c.address.includes(':')).map(c => c.port));
  const ipv6 = publicos.some(c => c.address.includes(':')) ? 'IPv6 público: sim.' : 'IPv6 público: não.';
  $('rede').textContent = (
    !publicos.length ? 'Sua rede não respondeu por UDP (firewall ou VPN): a conexão direta não vai funcionar.'
    : portasV4.size > 1 ? 'Sua rede usa NAT restritivo: a conexão direta costuma falhar. Tente sem VPN ou pela rede fixa.'
    : 'Sua rede aceita conexão direta.') + ' ' + ipv6;
}
$('testar').onclick = () => testarRede().catch(() => { $('rede').textContent = 'Não foi possível testar a rede neste navegador.'; });

// ---------- início ----------

if (sala) {
  $('dica').textContent = 'Você foi convidado para assistir.';
  $('acao').textContent = 'Assistir';
  $('acao').onclick = () => { avisar('Conectando…'); assistir(); };
  addEventListener('pagehide', () => peer?.destroy());
  document.addEventListener('visibilitychange', () => {   // voltou para a aba: confere se a conexão sobreviveu
    const estado = chamadaAtual?.peerConnection?.connectionState;
    if (!document.hidden && peer && estado && estado !== 'connected' && estado !== 'connecting') reconectar();
  });
} else {
  $('dica').textContent = 'Escolha uma aba ou a tela inteira e marque a opção de compartilhar o áudio.';
  $('acao').textContent = 'Compartilhar tela';
  $('acao').onclick = compartilhar;
  $('copiar').onclick = () => navigator.clipboard.writeText($('link').value).then(() => {
    $('copiar').textContent = 'Copiado';
    setTimeout(() => { $('copiar').textContent = 'Copiar link'; }, 1500);
  });
  $('qualidade').onchange = () => chamadas.forEach(limitar);
  // O codec é combinado na conexão: derruba as chamadas e os amigos reconectam sozinhos já com o novo.
  $('codec').onchange = () => [...chamadas].forEach(c => c.close());
  $('parar').onclick = parar;
}
</script>
</html>
